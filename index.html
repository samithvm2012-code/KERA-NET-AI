<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KERA-NET AI - Chat Workspace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { margin: 0; display: flex; height: 100vh; background: #0d1117; color: #c9d1d9; font-family: sans-serif; overflow: hidden; }
        .sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; padding: 15px; }
        .new-chat-btn { background: #238636; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 20px; text-align: center; }
        .new-chat-btn:hover { background: #2ea043; }
        .chat-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .chat-item { padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; color: #8b949e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item:hover, .chat-item.active { background: #30363d; color: #fff; }
        
        .main-chat { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        .chat-header { padding: 15px 20px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .message { max-width: 75%; padding: 12px 16px; border-radius: 10px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .message.user { background: #1f6feb; color: #fff; align-self: flex-end; }
        .message.ai { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; align-self: flex-start; white-space: pre-wrap; }
        
        .chat-input-area { padding: 20px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 10px; }
        .chat-input-area textarea { flex: 1; height: 45px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px; color: #fff; resize: none; font-size: 0.95rem; }
        .chat-input-area button { background: #238636; color: #fff; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .logout-link { color: #ff7b72; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
        <div style="font-size: 0.8rem; color: #8b949e; margin-bottom: 10px; font-weight: bold;">Recent Conversations</div>
        <ul class="chat-list" id="chat-list">
            <!-- Dynamically populated chat history -->
        </ul>
        <div style="margin-top: auto; padding-top: 10px; border-top: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.8rem; color: #8b949e;">samith</span>
            <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <span style="font-weight: bold; color: #00f2fe;">KERA-NET AI &bull; {{ engine }}</span>
            <span style="font-size: 0.8rem; color: #8b949e;">{{ version }}</span>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div style="text-align: center; color: #8b949e; margin-top: 40px;" id="welcome-banner">
                <h2>How can SAGE help you today?</h2>
                <p>Type your question below to start chatting.</p>
            </div>
        </div>

        <div class="chat-input-area">
            <textarea id="user-input" placeholder="Ask anything..." rows="1" onkeydown="handleKey(event)"></textarea>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let currentSessionId = 'session_' + Date.now();

        document.addEventListener("DOMContentLoaded", () => {
            loadChatSessions();
            startNewChat();
        });

        function startNewChat() {
            currentSessionId = 'session_' + Date.now();
            document.getElementById('chat-messages').innerHTML = `
                <div style="text-align: center; color: #8b949e; margin-top: 40px;" id="welcome-banner">
                    <h2>How can SAGE help you today?</h2>
                    <p>Type your question below to start chatting.</p>
                </div>
            `;
            loadChatSessions();
        }

        async function loadChatSessions() {
            try {
                const res = await fetch('/api/sessions');
                const data = await res.json();
                if (data.success) {
                    const listEl = document.getElementById('chat-list');
                    listEl.innerHTML = '';
                    data.sessions.forEach(s => {
                        const li = document.createElement('li');
                        li.className = `chat-item ${s.id === currentSessionId ? 'active' : ''}`;
                        li.innerText = s.title;
                        li.onclick = () => loadSessionHistory(s.id);
                        listEl.appendChild(li);
                    });
                }
            } catch (e) { console.error(e); }
        }

        async function loadSessionHistory(sessionId) {
            currentSessionId = sessionId;
            try {
                const res = await fetch(`/api/chat/${sessionId}`);
                const data = await res.json();
                if (data.success) {
                    const messagesEl = document.getElementById('chat-messages');
                    messagesEl.innerHTML = '';
                    if (data.messages.length === 0) {
                        messagesEl.innerHTML = `<div style="text-align: center; color: #8b949e; margin-top: 40px;"><h2>New Chat</h2></div>`;
                        return;
                    }
                    data.messages.forEach(m => {
                        const div = document.createElement('div');
                        div.className = `message ${m.sender === 'user' ? 'user' : 'ai'}`;
                        div.innerText = m.message;
                        messagesEl.appendChild(div);
                    });
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                    loadChatSessions();
                }
            } catch (e) { console.error(e); }
        }

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputEl = document.getElementById('user-input');
            const question = inputEl.value.trim();
            if (!question) return;

            const banner = document.getElementById('welcome-banner');
            if (banner) banner.remove();

            const messagesEl = document.getElementById('chat-messages');
            
            // Append User Message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = question;
            messagesEl.appendChild(userMsg);
            
            inputEl.value = '';
            messagesEl.scrollTop = messagesEl.scrollHeight;

            // Append Loading Indicator
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message ai';
            loadingMsg.innerText = 'SAGE is thinking...';
            messagesEl.appendChild(loadingMsg);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, session_id: currentSessionId })
                });
                const data = await response.json();

                loadingMsg.remove();

                if (data.success) {
                    const aiMsg = document.createElement('div');
                    aiMsg.className = 'message ai';
                    aiMsg.innerText = data.answer;
                    messagesEl.appendChild(aiMsg);
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                    loadChatSessions();
                } else {
                    const errMsg = document.createElement('div');
                    errMsg.className = 'message ai';
                    errMsg.style.color = '#ff7b72';
                    errMsg.innerText = 'Error: ' + data.error;
                    messagesEl.appendChild(errMsg);
                }
            } catch (err) {
                loadingMsg.remove();
                alert('Connection failed');
            }
        }
    </script>
</body>
</html>
